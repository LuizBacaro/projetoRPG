# alembic.ini
[alembic]
# Caminho para o diretório de migrações
script_location = alembic

# A URL real é injetada pelo env.py via DATABASE_URL do ambiente.
# Este valor é ignorado em produção, mas necessário para o Alembic não quebrar.
sqlalchemy.url = sqlite:///./rpg_arena.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S