# alembic.ini
#
# Este arquivo de configuração é usado pelo Alembic para gerenciar as migrações
# do banco de dados. Ele define a localização dos scripts de migração,
# a conexão com o banco de dados e as configurações de log.

[alembic]
# Caminho para o diretório onde os scripts de migração serão armazenados.
# Por padrão, é o subdiretório 'alembic' dentro do diretório raiz do projeto.
#script_location = alembic
script_location = alembic_migrations
# Adiciona o diretório atual (onde o alembic.ini está localizado) ao sys.path do Python.
# Isso é CRÍTICO para que o Alembic consiga encontrar os módulos da sua aplicação (ex: 'app').
prepend_sys_path = .

# URL de conexão com o banco de dados.
# Em ambientes de produção, esta URL é geralmente sobrescrita dinamicamente
# pelo 'env.py' usando variáveis de ambiente (ex: DATABASE_URL).
# Para desenvolvimento local, 'sqlite:///./rpg_arena.db' aponta para um arquivo SQLite.
sqlalchemy.url = sqlite:///./rpg_arena.db

# Caractere usado para separar o caminho do arquivo de versão em mensagens de log.
version_path_separator = :

# A configuração 'file_template' não está definida aqui, usando o padrão do Alembic.
# Se desejar um template específico para nomes de arquivos de migração,
# você pode descomentar e configurar uma linha como:
# file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
# Esta seção pode ser usada para definir hooks que são executados após a escrita
# de um novo script de migração. Atualmente, está vazia.

[loggers]
# Define os loggers que serão configurados.
keys = root,sqlalchemy,alembic

[handlers]
# Define os handlers de log que serão usados.
keys = console

[formatters]
# Define os formatters de log que serão aplicados aos handlers.
keys = generic

[logger_root]
# Configurações para o logger raiz.
# 'level = WARN' significa que apenas mensagens de aviso ou mais graves serão exibidas.
level = WARN
# O handler 'console' será usado para exibir as mensagens.
handlers = console
# 'qualname' vazio indica que este é o logger raiz.
qualname =

[logger_sqlalchemy]
# Configurações para o logger do SQLAlchemy.
# 'level = WARN' para evitar logs excessivos do ORM.
level = WARN
# O handler 'console' será usado.
handlers = console
# 'qualname = sqlalchemy.engine' direciona os logs do motor do SQLAlchemy para este logger.
qualname = sqlalchemy.engine

[logger_alembic]
# Configurações para o logger do Alembic.
# 'level = INFO' para ver informações sobre o processo de migração.
level = INFO
# O handler 'console' será usado.
handlers = console
# 'qualname = alembic' direciona os logs do próprio Alembic para este logger.
qualname = alembic

[handler_console]
# Configurações para o handler de console.
# 'class = StreamHandler' indica que os logs serão enviados para um stream (saída padrão).
class = StreamHandler
# 'args = (sys.stderr,)' envia os logs para a saída de erro padrão.
args = (sys.stderr,)
# 'level = NOTSET' significa que este handler processará mensagens de qualquer nível
# que cheguem a ele (o nível efetivo é determinado pelo logger).
level = NOTSET
# O formatter 'generic' será usado para formatar as mensagens.
formatter = generic

[formatter_generic]
# Configurações para o formatter genérico.
# Define o formato das mensagens de log.
# %(levelname)-5.5s: Nível do log (ex: INFO, WARN), alinhado à esquerda em 5 caracteres.
# [%(name)s]: Nome do logger.
# %(message)s: A mensagem do log.
format = %(levelname)-5.5s [%(name)s] %(message)s
# Define o formato da data e hora para o log.
datefmt = %H:%M:%S