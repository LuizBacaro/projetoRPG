name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Executar testes E2E smoke?"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

jobs:
  # ──────────────────────────────────────────
  # Backend: pytest completo
  # ──────────────────────────────────────────
  backend:
    name: Backend Tests (Python 3.11)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest tests/ -q --tb=short --ignore=tests/e2e --cov=app --cov-report=term-missing

  # ──────────────────────────────────────────
  # Frontend: testes unitários JS
  # ──────────────────────────────────────────
  frontend:
    name: Frontend Tests (Node 18)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Run frontend unit tests
        run: node test-ficha-perfil-simples.js

  # ──────────────────────────────────────────
  # E2E Smoke: Playwright (opcional / manual)
  # Disparo: workflow_dispatch com run_e2e=true
  # Requer servidor rodando em BASE_URL
  # ──────────────────────────────────────────
  e2e:
    name: E2E Smoke (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e == 'true' }}

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt playwright pytest-playwright

      - name: Install Playwright browsers
        run: python -m playwright install chromium --with-deps

      - name: Start API server
        run: |
          cp ../.env.example .env 2>/dev/null || true
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
        env:
          # SECRET_KEY apenas para o banco SQLite isolado deste job de CI — nunca usar em produção
          SECRET_KEY: ci-test-secret-key-32chars-minimum!
          DATABASE_URL: sqlite:///./test_e2e.db
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || 'admin@arena.local' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'admin123' }}

      - name: Run E2E smoke tests
        run: python -m pytest tests/e2e/ -v --tb=short
        env:
          BASE_URL: http://localhost:8000
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || 'admin@arena.local' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'admin123' }}
