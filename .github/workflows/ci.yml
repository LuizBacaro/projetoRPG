name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop, feature/salva]
  pull_request:
    branches: [main, master, develop, feature/salva]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Executar testes E2E smoke?"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

jobs:
  # ──────────────────────────────────────────
  # Backend: linting, formatação, testes e segurança
  # ──────────────────────────────────────────
  backend:
    name: Backend Tests (Python 3.11)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint and format code
        run: |
          pip install black flake8 isort
          black --check --diff app/ tests/
          flake8 app/ tests/ --max-line-length=88 --extend-ignore=E203,W503
          isort --check-only --diff app/ tests/

      - name: Security scan
        run: |
          pip install safety bandit
          safety check
          bandit -r app/ -f json -o bandit-report.json || true

      - name: Run pytest with coverage
        run: python -m pytest tests/ -q --tb=short --ignore=tests/e2e --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: backend

  # ──────────────────────────────────────────
  # Frontend: testes unitários JS e linting básico
  # ──────────────────────────────────────────
  frontend:
    name: Frontend Tests (Node 18)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm

      - name: Install ESLint (if package.json exists)
        run: npm install eslint --save-dev || true

      - name: Lint JavaScript files
        run: npx eslint js/ --ext .js || echo "ESLint not configured, skipping"

      - name: Run frontend unit tests
        run: node test-ficha-perfil-simples.js

  # ──────────────────────────────────────────
  # E2E Smoke: Playwright (opcional / manual)
  # Disparo: workflow_dispatch com run_e2e=true
  # Requer servidor rodando em BASE_URL
  # ──────────────────────────────────────────
  e2e:
    name: E2E Smoke (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e == 'true' }}

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt playwright pytest-playwright

      - name: Install Playwright browsers
        run: python -m playwright install chromium --with-deps

      - name: Start API server
        run: |
          cp ../.env.example .env 2>/dev/null || true
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
        env:
          # SECRET_KEY apenas para o banco SQLite isolado deste job de CI — nunca usar em produção
          SECRET_KEY: ci-test-secret-key-32chars-minimum!
          DATABASE_URL: sqlite:///./test_e2e.db
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || 'admin@arena.local' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'admin123' }}

      - name: Run E2E smoke tests
        run: python -m pytest tests/e2e/ -v --tb=short
        env:
          BASE_URL: http://localhost:8000
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || 'admin@arena.local' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'admin123' }}

  # ──────────────────────────────────────────
  # Deploy para Staging (apenas em push para develop)
  # ──────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Deploy Backend to Render (Staging)
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}

      - name: Deploy Frontend to Vercel (Staging)
        run: |
          npm install -g vercel
          vercel --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
        working-directory: frontend

  # ──────────────────────────────────────────
  # Notificações em caso de falha
  # ──────────────────────────────────────────
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    if: failure() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
