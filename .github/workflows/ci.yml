name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - feature/salva
      - "feature/**"
  pull_request:
    branches:
      - main
      - master
      - develop
      - feature/salva
      - "feature/**"
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Executar testes E2E smoke?"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────
  # Backend: linting, formatação, testes e segurança
  # ──────────────────────────────────────────
  backend:
    name: Backend Tests (Python 3.11)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black==24.10.0 flake8==7.1.1 isort==5.13.2 safety==3.2.11 bandit==1.8.0

      - name: Lint and format code
        run: |
          black --check --diff app/ tests/
          flake8 app/ tests/ --max-line-length=120 --extend-ignore=E203,W503,E402,E501,E712,F401,F403,F541,F841
          isort --check-only --diff --profile black app/ tests/

      - name: Security scan
        run: |
          safety check --full-report || true
          bandit -r app/ -ll -f json -o bandit-report.json || true

      # Cobertura total da suite ~73% (maio/2026); restaurar 80% com mais testes.
      - name: Run pytest with coverage
        run: python -m pytest tests/ -q --tb=short --ignore=tests/e2e --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=72

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          file: ./backend/coverage.xml
          flags: backend

  # ──────────────────────────────────────────
  # Alembic em Postgres (evita regressão tipo create_all + upgrade)
  # ──────────────────────────────────────────
  migrations:
    name: Alembic (Postgres 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arena
          POSTGRES_PASSWORD: arena
          POSTGRES_DB: arena_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arena -d arena_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://arena:arena@localhost:5432/arena_ci

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Migrações incrementais assumem baseline legado; em Postgres vazio usar metadata + stamp.
      - name: Schema inicial (Postgres vazio) + stamp Alembic head
        run: python -m scripts.ci_postgres_empty_schema

      - name: Alembic upgrade idempotente
        run: python -m alembic upgrade head

      - name: Verificar head único
        run: |
          heads=$(python -m alembic heads 2>/dev/null | wc -l)
          if [ "$heads" -gt 1 ]; then
            echo "::error::Múltiplos heads no Alembic; resolva antes do merge."
            python -m alembic heads
            exit 1
          fi

  # ──────────────────────────────────────────
  # Frontend: testes unitários JS e linting básico
  # ──────────────────────────────────────────
  frontend:
    name: Frontend Tests (Node 22)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ESLint (opcional)
        run: npm install eslint --save-dev --no-package-lock || true

      - name: Lint JavaScript files
        run: npx eslint js/ games/dnd35/js/ --ext .js || echo "ESLint not configured, skipping"

      - name: Run frontend unit tests
        run: node games/dnd35/test-ficha-perfil-simples.js

  # ──────────────────────────────────────────
  # E2E Smoke: Playwright (PR + push develop/feature/salva + manual)
  # ──────────────────────────────────────────
  e2e:
    name: E2E Smoke (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend, migrations]
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/feature/salva')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e == 'true')

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright pytest-playwright

      - name: Install Playwright browsers
        run: python -m playwright install chromium --with-deps

      # O uvicorn tem de subir e ficar vivo no *mesmo* passo que o pytest: ao terminar um step,
      # o shell encerra e processos em background costumam morrer (SIGHUP) — o E2E corria sem API.
      - name: Start API server and run E2E smoke
        run: |
          export ADMIN_EMAIL="${ADMIN_EMAIL:-admin@arena.local}"
          export ADMIN_PASSWORD="${ADMIN_PASSWORD:-admin123}"
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          UV_PID=$!
          cleanup() { kill "$UV_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 40); do
            if curl -fsS "http://localhost:8000/health/live" >/dev/null 2>&1; then
              echo "API pronta (pid=$UV_PID)."
              break
            fi
            sleep 1
          done
          curl -fsS "http://localhost:8000/health/live" >/dev/null || {
            echo "::error::Timeout aguardando /health/live"
            exit 1
          }
          python -m pytest tests/e2e/ -v --tb=short
        env:
          SECRET_KEY: ci-test-secret-key-32chars-minimum!
          DATABASE_URL: sqlite:///./test_e2e.db
          STARTUP_RUN_ALEMBIC: "0"
          BASE_URL: http://localhost:8000
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

  # ──────────────────────────────────────────
  # Deploy Staging: push em develop
  # ──────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [backend, frontend, migrations]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging

    env:
      RENDER_DEPLOY_HOOK_STAGING: ${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy Backend to Render (Staging)
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK_STAGING:-}" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_STAGING não definido — configure em Settings → Secrets (repositório ou environment staging)."
          else
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_STAGING"
          fi

      - name: Deploy Frontend to Vercel (Staging)
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::warning::VERCEL_TOKEN não definido — deploy front staging ignorado."
          else
            npm install -g vercel
            vercel --prod --token "$VERCEL_TOKEN" --yes
          fi

  # ──────────────────────────────────────────
  # Deploy Produção: push em feature/salva
  # ──────────────────────────────────────────
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend, frontend, migrations, e2e]
    if: github.ref == 'refs/heads/feature/salva' && github.event_name == 'push'
    environment: production

    env:
      RENDER_DEPLOY_HOOK_PROD: ${{ secrets.RENDER_DEPLOY_HOOK_PROD }}
      SMOKE_TOKEN_GURPS: ${{ secrets.SMOKE_TOKEN_GURPS }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy Backend to Render (Production)
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK_PROD:-}" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_PROD não definido — configure para disparar deploy ou use só auto-deploy do Render."
          else
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_PROD"
          fi

      - name: Smoke /health/live (API Render)
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK_PROD:-}" ]; then
            echo "::notice::Smoke pós-deploy ignorado (hook de produção não configurado)."
            exit 0
          fi
          for i in $(seq 1 40); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "https://projetorpg-7ih3.onrender.com/health/live" || true)
            if [ "$code" = "200" ]; then echo "Health OK"; exit 0; fi
            sleep 15
          done
          echo "::error::Health check falhou após deploy"
          exit 1

      - name: Smoke catálogo GURPS (opcional)
        run: |
          if [ -z "${SMOKE_TOKEN_GURPS:-}" ]; then
            echo "::notice::SMOKE_TOKEN_GURPS não definido — smoke GURPS omitido."
            exit 0
          fi
          curl -fsS -H "Authorization: Bearer ${SMOKE_TOKEN_GURPS}" \
            "https://projetorpg-7ih3.onrender.com/api/v1/gurps/personagens/catalogo/lite-ficha" \
            | python -c "import sys, json; d=json.load(sys.stdin); print(json.dumps(d.get('meta', {}), indent=2, ensure_ascii=False))"

  # ──────────────────────────────────────────
  # Notificações em caso de falha (branches principais)
  # ──────────────────────────────────────────
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [backend, frontend, migrations, e2e, deploy-staging, deploy-prod]
    if: |
      always() &&
      (needs.backend.result == 'failure' ||
       needs.frontend.result == 'failure' ||
       needs.migrations.result == 'failure' ||
       needs.e2e.result == 'failure' ||
       needs.deploy-staging.result == 'failure' ||
       needs.deploy-prod.result == 'failure') &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master' ||
       github.ref == 'refs/heads/develop' ||
       github.ref == 'refs/heads/feature/salva')

    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

    steps:
      - name: Notificar Slack (se configurado)
        run: |
          if [ -z "${SLACK_WEBHOOK:-}" ]; then
            echo "::notice::SLACK_WEBHOOK não definido — notificação omitida."
            exit 0
          fi
          payload=$(jq -n \
            --arg text "❌ CI falhou: ${{ github.workflow }} | ${{ github.ref }} | ${{ github.sha }}" \
            '{text: $text}')
          curl -fsS -X POST -H "Content-type: application/json" \
            --data "$payload" "$SLACK_WEBHOOK"
