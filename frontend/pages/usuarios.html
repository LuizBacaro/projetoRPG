<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usuários — Arena TTRPG</title>
    <!-- CSS compartilhados -->
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/botoes.css" />
    <!-- ✅ CSS extraído — SRP: HTML só estrutura -->
    <link rel="stylesheet" href="/css/usuarios.css" />
    
</head>
<body>
    <div class="container">

        <div class="page-header">
            <h1>👤 Gerenciamento de Usuários</h1>
            <div style="display:flex; gap:.75rem;">
                <a href="/dashboard" class="btn btn-secondary">← Dashboard</a>
                <button id="btnNovoUsuario" class="btn btn-primary">+ Novo Usuário</button>
            </div>
        </div>

        <div class="card">
            <table class="tabela-usuarios">
                <thead>
                    <tr>
                        <th>Perfil</th>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Status</th>
                        <th>Responsável</th>
                        <th>Data da Ação</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaUsuarios">
                    <tr><td colspan="7" style="text-align:center;padding:2rem;">Carregando...</td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <!-- Modal de cadastro/edição -->
    <div id="modalUsuario" class="modal-overlay">
        <div class="modal-box">
            <h2 id="modalUsuarioTitulo">Novo Usuário</h2>

            <div id="avisoInativo" class="aviso-inativo">
                ⚠️ Usuário inativo — somente o Status pode ser alterado.
            </div>

            <div class="form-group">
                <label>Perfil *</label>
                <select id="selectPerfil">
                    <option value="administrador">Administrador</option>
                    <option value="mestre">Mestre</option>
                    <option value="jogador" selected>Jogador</option>
                </select>
            </div>

            <div class="form-group">
                <label>Nome *</label>
                <input id="inputNome" type="text" placeholder="Nome completo" />
            </div>

            <div class="form-group">
                <label>E-mail * (usado no login)</label>
                <input id="inputEmail" type="email" placeholder="email@exemplo.com" />
            </div>

            <div class="form-group">
                <label>Senha * <small style="color:#888">(mín. 6 caracteres — deixe em branco para não alterar)</small></label>
                <input id="inputSenha" type="password" placeholder="••••••" />
            </div>

            <div class="form-group">
                <label>Status *</label>
                <select id="selectStatus">
                    <option value="ativo">Ativo</option>
                    <option value="inativo">Inativo</option>
                </select>
            </div>

            <div class="modal-acoes">
                <button class="btn btn-secondary" id="btnCancelarModal">Cancelar</button>
                <button class="btn btn-primary"   id="btnSalvarModal">Salvar</button>
            </div>
        </div>
    </div>

    <!--
        CRITICAL: api.config.js usa "export" — deve ser carregado com type="module"
        Os demais scripts são carregados dinamicamente DEPOIS do module,
        garantindo que window.getApiUrl e window.AuthService já existam.
    -->
    <script type="module">
        import { getApiUrl } from '/js/config/api.config.js';

        // Expõe globalmente para os scripts carregados dinamicamente
        window.getApiUrl = getApiUrl;

        const carregar = (src) => new Promise((resolve, reject) => {
            const s     = document.createElement('script');
            s.src       = src;
            s.onload    = resolve;
            s.onerror   = reject;
            document.body.appendChild(s);
        });

        // 1️⃣ AuthService — protege a página
        await carregar('/js/services/AuthService.js');
        AuthService.exigirLogin();

        if (!AuthService.isAdmin()) {
            alert('Acesso restrito a Administradores.');
            window.location.href = '/dashboard';
        }

        // 2️⃣ Scripts em ordem (cada um depende do anterior)
        await carregar('/js/services/UsuarioService.js');
        await carregar('/js/ui/ModalUsuario.js');
        await carregar('/js/controllers/UsuarioController.js');
    </script>

</body>
</html>
