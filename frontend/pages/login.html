<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Arena TTRPG</title>
     <link rel="stylesheet" href="/games/dnd35/css/login.css" />
    <link rel="stylesheet" href="/games/dnd35/css/responsivo.css" />
</head>
<body>

<!-- ── Tela de Login ────────────────────────────────────────────────────── -->
<div class="login-wrapper">

    <div class="login-logo">
        <h1>⚔️ Arena TTRPG</h1>
        <p>Plataforma de gestão de campanhas e combates</p>
    </div>

    <div class="login-card">
        <h2>Acesse sua conta</h2>

        <div id="erroLogin" class="msg-box msg-erro"></div>

        <form id="formLogin" autocomplete="on">
            <div class="form-group">
                <label>E-mail</label>
                <input id="inputEmail" type="email" placeholder="seu@email.com" autocomplete="email" />
            </div>

            <div class="form-group">
                <label>Senha</label>
                <input id="inputSenha" type="password" placeholder="••••••" autocomplete="current-password" />
            </div>

            <button id="btnLogin" type="submit" class="btn-login">Entrar</button>
        </form>

        <div id="grupoGoogle" class="oauth-google-group" style="display:none">
            <div class="divider">ou</div>
            <button type="button" id="btnGoogle" class="btn-google">Entrar com Google</button>
        </div>

        <div class="divider">ou</div>

        <button id="btnAbrirCadastro" class="btn-cadastro">✨ Criar nova conta</button>

        <p class="hint">Novas contas são criadas como <strong>Jogador</strong></p>
    </div>

</div>

<!-- ── Modal de Cadastro ─────────────────────────────────────────────────── -->
<div id="modalCadastro" class="modal-overlay">
    <div class="modal-box">

        <div class="modal-header">
            <h2>✨ Criar conta</h2>
            <button id="btnFecharCadastro" class="modal-close">×</button>
        </div>

        <div class="perfil-info">
            🎮 Sua conta será criada como <strong>Jogador</strong>.
            Depois do login, você pode criar campanhas e mestrar suas mesas na plataforma.
        </div>

        <div id="erroCadastro"  class="msg-box msg-erro"></div>
        <div id="sucessoCadastro" class="msg-box msg-sucesso"></div>

        <form id="formCadastro" autocomplete="on">
            <div class="form-group">
                <label>Nome completo *</label>
                <input id="cadNome" type="text" placeholder="Seu nome" autocomplete="name" />
            </div>

            <div class="form-group">
                <label>E-mail *</label>
                <input id="cadEmail" type="email" placeholder="seu@email.com" autocomplete="email" />
            </div>

            <div class="form-group">
                <label>Senha * <small style="color:#64748b">(mín. 6 caracteres)</small></label>
                <input id="cadSenha" type="password" placeholder="••••••" autocomplete="new-password" />
            </div>

            <div class="form-group">
                <label>Confirmar senha *</label>
                <input id="cadConfirma" type="password" placeholder="••••••" autocomplete="new-password" />
            </div>

            <button id="btnSalvarCadastro" type="submit" class="btn-login" style="margin-top:.25rem">
                Criar conta
            </button>

            <button id="btnCancelarCadastro" type="button" class="btn-cadastro">
                Cancelar
            </button>
        </form>

    </div>
</div>

<!-- ── Scripts ───────────────────────────────────────────────────────────── -->
<script src="/js/shared/render-api-origin-boot.js"></script>
<script type="module">
    import { getApiUrl } from '/games/dnd35/js/config/api.config.js?v=20260604';
    import {
        warmupApi,
        waitForApiReady,
        trySilentRefresh,
        postJsonWithRetry,
        persistSession,
        redirectAfterLogin,
        fetchOAuthGoogleStatus,
    } from '/js/shared/auth-session.js?v=20260606';

    // ── Elementos de Login ────────────────────────────────────────────────
    const btnLogin   = document.getElementById('btnLogin');
    const inputEmail = document.getElementById('inputEmail');
    const inputSenha = document.getElementById('inputSenha');
    const erroLogin  = document.getElementById('erroLogin');

    // ── Elementos de Cadastro ─────────────────────────────────────────────
    const modalCadastro     = document.getElementById('modalCadastro');
    const btnAbrirCadastro  = document.getElementById('btnAbrirCadastro');
    const btnFecharCadastro = document.getElementById('btnFecharCadastro');
    const btnCancelarCadastro = document.getElementById('btnCancelarCadastro');
    const btnSalvarCadastro = document.getElementById('btnSalvarCadastro');
    const cadNome           = document.getElementById('cadNome');
    const cadEmail          = document.getElementById('cadEmail');
    const cadSenha          = document.getElementById('cadSenha');
    const cadConfirma       = document.getElementById('cadConfirma');
    const erroCadastro      = document.getElementById('erroCadastro');
    const sucessoCadastro   = document.getElementById('sucessoCadastro');
    const grupoGoogle       = document.getElementById('grupoGoogle');
    const btnGoogle         = document.getElementById('btnGoogle');

    function limparSessaoLocal() {
        localStorage.removeItem('token');
        localStorage.removeItem('usuario');
        localStorage.removeItem('refresh_token');
    }

    // ── Entrada: warm-up + refresh silencioso (mantém 24h sem pedir senha de novo)
    (async function iniciarSessao() {
        const temRefresh = !!localStorage.getItem('refresh_token');
        const temToken = !!localStorage.getItem('token');

        if (!temRefresh && !temToken) {
            btnLogin.disabled = false;
            btnLogin.textContent = 'Entrar';
            const oauthStatus = await fetchOAuthGoogleStatus();
            if (oauthStatus.google_enabled && grupoGoogle) {
                grupoGoogle.style.display = '';
            }
            return;
        }

        btnLogin.disabled = true;
        btnLogin.textContent = 'Verificando sessão…';
        await warmupApi();
        await waitForApiReady({ timeoutMs: 90000 });
        const renovou = await trySilentRefresh();
        if (renovou) {
            redirectAfterLogin();
            return;
        }
        limparSessaoLocal();
        btnLogin.disabled = false;
        btnLogin.textContent = 'Entrar';

        const oauthStatus = await fetchOAuthGoogleStatus();
        if (oauthStatus.google_enabled && grupoGoogle) {
            grupoGoogle.style.display = '';
        }
    })();

    // ── Helpers ───────────────────────────────────────────────────────────

    function mostrarErroLogin(msg) {
        erroLogin.textContent   = msg;
        erroLogin.style.display = 'block';
    }

    function ocultarErroLogin() {
        erroLogin.style.display = 'none';
    }

    function mostrarErroCadastro(msg) {
        erroCadastro.textContent      = msg;
        erroCadastro.style.display    = 'block';
        sucessoCadastro.style.display = 'none';
    }

    function mostrarSucessoCadastro(msg) {
        sucessoCadastro.textContent   = msg;
        sucessoCadastro.style.display = 'block';
        erroCadastro.style.display    = 'none';
    }

    function limparCadastro() {
        cadNome.value     = '';
        cadEmail.value    = '';
        cadSenha.value    = '';
        cadConfirma.value = '';
        erroCadastro.style.display    = 'none';
        sucessoCadastro.style.display = 'none';
    }

    // ── Login ─────────────────────────────────────────────────────────────

    async function fazerLogin() {
        ocultarErroLogin();

        const email = inputEmail.value.trim();
        const senha = inputSenha.value;

        if (!email || !senha) {
            mostrarErroLogin('Preencha e-mail e senha.');
            return;
        }

        btnLogin.disabled    = true;
        btnLogin.textContent = 'Conectando…';

        try {
            await warmupApi();
            btnLogin.textContent = 'Preparando servidor…';
            const pronto = await waitForApiReady({ timeoutMs: 120000 });
            if (!pronto) {
                mostrarErroLogin(
                    'O servidor ainda está inicializando. Aguarde um minuto e tente de novo.'
                );
                return;
            }
            const res = await postJsonWithRetry(
                '/auth/login',
                { email, senha },
                {
                    maxAttempts: 12,
                    baseDelayMs: 1500,
                    onRetry(attempt) {
                        btnLogin.textContent =
                            attempt === 1
                                ? 'Servidor acordando…'
                                : `Tentando de novo (${attempt})…`;
                    },
                }
            );

            const ct = res.headers.get('Content-Type') || '';
            let data;
            if (ct.includes('application/json')) {
                data = await res.json();
            } else {
                const text = await res.text();
                console.error(
                    'Resposta não-JSON do login:',
                    getApiUrl('/auth/login'),
                    res.status,
                    text.slice(0, 200)
                );
                mostrarErroLogin(
                    res.status === 404
                        ? 'Não encontramos a API neste endereço. Faça um recarregamento forçado (Ctrl+Shift+R) e confira o deploy.'
                        : res.status === 503
                          ? 'Servidor ainda inicializando. Aguarde alguns segundos e tente novamente.'
                          : 'Servidor retornou resposta inválida. Tente de novo em instantes.'
                );
                return;
            }

            if (!res.ok) {
                mostrarErroLogin(data.detail || 'E-mail ou senha incorretos.');
                return;
            }

            persistSession(data);
            redirectAfterLogin();

        } catch (err) {
            mostrarErroLogin('Erro de conexão com o servidor.');
            console.error(err);
        } finally {
            btnLogin.disabled    = false;
            btnLogin.textContent = 'Entrar';
        }
    }

    if (btnGoogle) {
        btnGoogle.addEventListener('click', () => {
            window.location.href = getApiUrl('/auth/oauth/google/authorize');
        });
    }

    // ── Cadastro ──────────────────────────────────────────────────────────

    async function fazerCadastro() {
        const nome     = cadNome.value.trim();
        const email    = cadEmail.value.trim();
        const senha    = cadSenha.value;
        const confirma = cadConfirma.value;

        // Validações no cliente
        if (!nome || !email || !senha || !confirma) {
            mostrarErroCadastro('Preencha todos os campos.');
            return;
        }
        if (senha.length < 6) {
            mostrarErroCadastro('Senha deve ter ao menos 6 caracteres.');
            return;
        }
        if (senha !== confirma) {
            mostrarErroCadastro('As senhas não coincidem.');
            return;
        }

        btnSalvarCadastro.disabled    = true;
        btnSalvarCadastro.textContent = 'Criando conta...';

        try {
            const res = await fetch(getApiUrl('/auth/registro'), {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ nome, email, senha })
            });

            const data = await res.json();

            if (!res.ok) {
                mostrarErroCadastro(data.detail || 'Erro ao criar conta.');
                return;
            }

            // Sucesso — orienta o usuário a fazer login
            mostrarSucessoCadastro(`✅ Conta criada com sucesso! Bem-vindo, ${data.nome}! Faça login para continuar.`);

            // Pré-preenche o e-mail no campo de login
            inputEmail.value = email;

            // Fecha o modal após 2 segundos
            setTimeout(() => {
                modalCadastro.classList.remove('show');
                limparCadastro();
                inputSenha.focus();
            }, 2000);

        } catch (err) {
            mostrarErroCadastro('Erro de conexão com o servidor.');
            console.error(err);
        } finally {
            btnSalvarCadastro.disabled    = false;
            btnSalvarCadastro.textContent = 'Criar conta';
        }
    }

    // ── Eventos ───────────────────────────────────────────────────────────

    // Login via form submit
    document.getElementById('formLogin').addEventListener('submit', (e) => {
        e.preventDefault();
        fazerLogin();
    });

    // Abrir modal de cadastro
    btnAbrirCadastro.addEventListener('click', () => {
        limparCadastro();
        modalCadastro.classList.add('show');
        cadNome.focus();
    });

    // Fechar modal
    const fecharModal = () => {
        modalCadastro.classList.remove('show');
        limparCadastro();
    };
    btnFecharCadastro.addEventListener('click',   fecharModal);
    btnCancelarCadastro.addEventListener('click', fecharModal);

    // Fechar modal clicando fora
    modalCadastro.addEventListener('click', (e) => {
        if (e.target === modalCadastro) fecharModal();
    });

    // Salvar cadastro via form submit
    document.getElementById('formCadastro').addEventListener('submit', (e) => {
        e.preventDefault();
        fazerCadastro();
    });
</script>

</body>
</html>
