<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perícias — Ficha do Personagem</title>
    <!-- Estilos da ficha (medieval/pergaminho) -->
    <link rel="stylesheet" href="../css/ficha-personagem.css?v=1">
    <style>
        /* Override para página full de perícias */
        .ficha-wrapper {
            max-width: 1200px;
        }

        /* Tabela de perícias estilizada */
        .pericias-tabela-wrapper {
            background: linear-gradient(135deg, #f4e9d0 0%, #e8d5b0 100%);
            border: 2px solid #8b5e3c;
            border-radius: 10px;
            padding: 1rem;
            box-shadow: 0 4px 20px rgba(44, 26, 14, 0.25);
            overflow: auto;
        }

        .pericias-tabela {
            width: 100%;
            border-collapse: collapse;
            background: #f4e9d0;
        }

        .pericias-tabela thead {
            background: linear-gradient(135deg, #5c3a1e 0%, #3d2410 100%);
            color: #c9a84c;
        }

        .pericias-tabela thead th {
            padding: 12px;
            text-align: left;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            border: 1px solid #8b5e3c;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .pericias-tabela tbody tr {
            border-bottom: 1px solid #d4c8b0;
            transition: background 0.2s;
        }

        .pericias-tabela tbody tr:hover {
            background: #f0e8d8;
        }

        .pericias-tabela td {
            padding: 10px 12px;
            border: 1px solid #d4c8b0;
            font-size: 0.9rem;
            color: #2c1a0e;
        }

        .pericias-nome {
            font-weight: 700;
            color: #5c3a1e;
            font-family: 'Cinzel', serif;
        }

        .pericias-descricao {
            font-size: 0.8rem;
            color: #4a3020;
            font-style: italic;
        }

        .pericias-atributo {
            text-align: center;
            font-weight: 700;
            color: #8b5e3c;
            font-family: 'Cinzel', serif;
            min-width: 50px;
        }

        .pericias-custo {
            text-align: center;
            font-weight: 700;
            font-family: 'Cinzel', serif;
            min-width: 60px;
            padding: 5px;
            border-radius: 4px;
        }

        .pericias-custo.classe {
            background: rgba(144, 238, 144, 0.3);
            color: #1a5c2a;
        }

        .pericias-custo.nao-classe {
            background: rgba(255, 182, 193, 0.3);
            color: #8b1a1a;
        }

        .pericias-inputs {
            display: grid;
            grid-template-columns: 50px 50px 50px;
            gap: 8px;
            align-items: center;
        }

        .pericias-input {
            padding: 6px;
            border: 1px solid #8b5e3c;
            border-radius: 4px;
            text-align: center;
            font-family: 'Cinzel', serif;
            font-weight: 600;
        }

        .pericias-input:disabled {
            background: #e8d5b0;
            cursor: not-allowed;
        }

        .pericias-btn-adicionar {
            padding: 6px 12px;
            background: linear-gradient(135deg, #1a5c2a 0%, #0f3d1a 100%);
            color: #fff;
            border: 1px solid #1a5c2a;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
            font-family: 'Cinzel', serif;
            transition: all 0.2s;
        }

        .pericias-btn-adicionar:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .pericias-header-info {
            background: linear-gradient(135deg, #f4e9d0 0%, #e8d5b0 100%);
            border: 2px solid #8b5e3c;
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1rem;
            box-shadow: 0 4px 20px rgba(44, 26, 14, 0.25);
        }

        .pericias-header-info p {
            font-family: 'Cinzel', serif;
            font-size: 0.95rem;
            color: #5c3a1e;
            margin: 0.5rem 0;
        }

        .pericias-header-info strong {
            color: #2c1a0e;
            font-weight: 700;
        }

        .pericias-busca-wrapper {
            background: linear-gradient(135deg, #f4e9d0 0%, #e8d5b0 100%);
            border: 2px solid #8b5e3c;
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1rem;
            box-shadow: 0 4px 20px rgba(44, 26, 14, 0.25);
        }

        .pericias-busca {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #8b5e3c;
            border-radius: 4px;
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
        }

        .pericias-footer {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1.5rem;
        }

        .pericias-btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: 2px solid;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pericias-btn-voltar {
            background: linear-gradient(135deg, #c9a84c 0%, #a87d30 100%);
            border-color: #5c3a1e;
            color: #5c3a1e;
        }

        .pericias-btn-voltar:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .pericias-loading {
            text-align: center;
            padding: 3rem;
            font-family: 'Cinzel', serif;
            color: #5c3a1e;
        }

        .pericias-vazio {
            text-align: center;
            padding: 2rem;
            color: #8b5e3c;
            font-style: italic;
            font-family: 'IM Fell English', serif;
        }
    </style>
</head>
<body>
    <div class="ficha-wrapper">
        <!-- HEADER -->
        <div class="ficha-header">
            <div style="flex: 1;">
                <h1 class="ficha-titulo-texto">⚔️ Perícias do Personagem</h1>
            </div>
            <button class="btn-voltar" onclick="window.history.back()">← Voltar</button>
        </div>

        <!-- INFO DO PERSONAGEM -->
        <div class="pericias-header-info">
            <p>👤 Personagem: <strong id="pericias-combatente-nome">Carregando...</strong></p>
            <p>📊 Classe: <strong id="pericias-combatente-classe">--</strong></p>
            <p>💾 Pontos Disponíveis: <strong id="pericias-pontos-disponiveis">0</strong></p>
        </div>

        <!-- BUSCA -->
        <div class="pericias-busca-wrapper">
            <input type="text" class="pericias-busca" id="pericias-busca" placeholder="🔍 Buscar perícia..." 
                   oninput="window.periciasFichaController && window.periciasFichaController.filtrar()">
        </div>

        <!-- TABELA -->
        <div class="pericias-tabela-wrapper">
            <div id="pericias-loading" style="display: none;">
                <div class="pericias-loading">⏳ Carregando perícias...</div>
            </div>
            <table class="pericias-tabela" id="pericias-tabela" style="display: none;">
                <thead>
                    <tr>
                        <th style="width: 35%;">Perícia</th>
                        <th style="width: 8%;">Atr.</th>
                        <th style="width: 10%;">Custo</th>
                        <th style="width: 8%;">Grad.</th>
                        <th style="width: 8%;">Mod.</th>
                        <th style="width: 8%;">Bôn.</th>
                        <th style="width: 8%;">Total</th>
                        <th style="width: 7%;">Ação</th>
                    </tr>
                </thead>
                <tbody id="pericias-tbody">
                    <tr><td colspan="6" class="pericias-vazio">Carregando perícias...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- FOOTER -->
        <div class="pericias-footer">
            <button class="pericias-btn pericias-btn-voltar" onclick="window.history.back()">
                ← Voltar para Ficha
            </button>
        </div>
    </div>

    <script type="module">
        import { PericiaFichaController } from '/js/controllers/PericiaFichaController.js';

        console.log('🎬 perícias-ficha.html carregado');

        // Validar token
        function validarAutenticacao() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            console.log('🔐 Validando autenticação...');
            console.log('✅ Token encontrado:', !!token);
            
            if (!token) {
                console.warn('⚠️ Sem token. Redirecionando para login...');
                window.location.href = '/pages/login.html?redirect=/pages/pericias-ficha.html';
                return false;
            }
            
            return true;
        }

        if (!validarAutenticacao()) {
            throw new Error('Autenticação necessária');
        }

        const controller = new PericiaFichaController();
        window.periciasFichaController = controller;

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                console.log('🎮 Inicializando PericiaFichaController...');
                const token = localStorage.getItem('token') || sessionStorage.getItem('token');
                if (!token) {
                    throw new Error('Token perdido durante carregamento');
                }
                
                await controller.inicializar();
                console.log('✅ Inicialização completa');
            } catch (error) {
                console.error('❌ Erro fatal:', error);
                document.body.innerHTML = `<div style="color: red; padding: 2rem;">${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
