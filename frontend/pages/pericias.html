<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perícias — Arena TTRPG</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/botoes.css">
    <link rel="stylesheet" href="/css/formularios.css">
    <link rel="stylesheet" href="/css/modais.css">
    <link rel="stylesheet" href="/css/responsivo.css">
    <link rel="stylesheet" href="/css/pericias.css">
</head>
<body>

<!-- ── Header ── -->
<header class="pericias-header">
    <div class="pericias-header-top">
        <button class="btn-voltar" id="btnVoltar">← Voltar</button>
        <h1>📚 Perícias</h1>
        <div style="width: 60px;"></div>
    </div>
    <div class="pericias-info">
        <span id="nomeCombatente" class="nome-combatente">—</span>
        <span class="separador">•</span>
        <span id="tipoCombatente" class="tipo-combatente">—</span>
    </div>
</header>

<!-- ── Corpo Principal ── -->
<main class="pericias-main">
    
    <!-- Busca/Filtro -->
    <div class="pericias-toolbar">
        <input 
            type="text" 
            id="inputBuscaPericia" 
            placeholder="🔍 Buscar perícia..."
            class="pericias-busca">
        <div class="pericias-contador">
            <span id="totalPericiasSelect">0</span> selecionadas
        </div>
    </div>

    <!-- Container de Perícias por Atributo -->
    <div id="periciasPorAtributo" class="pericias-container">
        <!-- Preenchido dinamicamente pelo JS -->
    </div>

    <!-- Sem resultados -->
    <div id="semPericias" class="pericias-sem-resultados" style="display: none;">
        <p>📭 Nenhuma perícia encontrada</p>
    </div>

</main>

<!-- ── Footer com Ações ── -->
<footer class="pericias-footer">
    <button type="button" class="btn-pericias-cancel" id="btnCancelarPericias">
        ❌ Cancelar
    </button>
    <button type="button" class="btn-pericias-limpar" id="btnLimparPericias">
        🗑️ Limpar Seleção
    </button>
    <button type="button" class="btn-pericias-salvar" id="btnSalvarPericias">
        ✅ Salvar Perícias
    </button>
</footer>

<!-- ══════════════════════════════════════════════════════════════ -->
<!-- Scripts                                                       -->
<!-- ══════════════════════════════════════════════════════════════ -->
<script type="module">
    import { getApiUrl } from '/js/config/api.config.js';
    import { Toast } from '/js/ui/toast.module.js';
    window.getApiUrl = getApiUrl;

    const carregar = (src) => new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = () => reject(new Error('Falha ao carregar: ' + src));
        document.body.appendChild(s);
    });

    await carregar('/js/services/AuthService.js');
    AuthService.exigirLogin();

    await carregar('/js/controllers/PericiasController.js');
</script>

</body>
</html>
