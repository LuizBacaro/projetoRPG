<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de Perícias para D&D 3.5">
    <meta name="theme-color" content="#8B4513">
    <title>Perícias - D&D 3.5</title>
    
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/pericias.css?v=7.0">
</head>
<body>
    <div class="pericias-wrapper">
        <!-- HEADER -->
        <header class="pericias-header">
            <button id="btn-voltar" class="btn-voltar">← Voltar</button>
            <div class="header-content">
                <h1>⚔️ Perícias do Personagem</h1>
                <p class="subtitulo">D&D 3.5 - Selecione e configure suas perícias</p>
            </div>
            <div class="header-info">
                <span id="combatente-nome" class="combatente-nome">👤 Carregando...</span>
                <span id="combatente-tipo" class="combatente-tipo">(tipo)</span>
            </div>
        </header>

        <!-- FILTROS -->
        <div class="filtros-container">
            <input type="text" id="filtro-busca" class="filtro-input" placeholder="🔍 Buscar perícia...">
            <button class="btn-filtro ativo" data-atributo="">Todas</button>
            <button class="btn-filtro" data-atributo="FOR">💪 FOR</button>
            <button class="btn-filtro" data-atributo="DES">🎯 DES</button>
            <button class="btn-filtro" data-atributo="CON">❤️ CON</button>
            <button class="btn-filtro" data-atributo="INT">🧠 INT</button>
            <button class="btn-filtro" data-atributo="SAB">👁️ SAB</button>
            <button class="btn-filtro" data-atributo="CAR">💬 CAR</button>
        </div>

        <!-- TABELA DE PERÍCIAS -->
        <div class="tabela-pericias-container">
            <table class="tabela-pericias" id="tabela-pericias">
                <thead>
                    <tr>
                        <th class="col-checkbox">✓</th>
                        <th class="col-nome">Perícia</th>
                        <th class="col-atributo">Atributo</th>
                        <th class="col-descricao">Descrição</th>
                        <th class="col-tipo">Tipo</th>
                    </tr>
                </thead>
                <tbody id="tbody-pericias">
                    <tr><td colspan="5" class="vazio">⏳ Carregando perícias...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- PERÍCIAS SELECIONADAS -->
        <div class="pericias-selecionadas-container">
            <h2 class="pericias-selecionadas-titulo">⭐ Perícias Selecionadas</h2>
            <div class="pericias-selecionadas-lista" id="pericias-selecionadas-lista">
                <p class="vazio">Nenhuma perícia selecionada ainda</p>
            </div>
            <button id="btn-salvar-pericias" class="btn-salvar-pericias">💾 Salvar Perícias</button>
        </div>
    </div>

    <div id="toast-container"></div>

    <script type="module">
        import { PericiaController } from '/js/controllers/PericiaController.js';
        import { NotificationService } from '/js/services/NotificationService.js';

        console.log('🎬 Script pericias.html carregado');

        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/pages/login.html';
        }

        const controller = new PericiaController();
        window.periciaController = controller;

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                console.log('🎮 Inicializando controller...');
                await controller.inicializar();
                setupEventos(controller);
                NotificationService.mostrarSucesso('✅ Perícias carregadas!');
            } catch (error) {
                console.error('❌ Erro:', error);
                NotificationService.mostrarErro('Erro: ' + error.message);
            }
        });

        function setupEventos(controller) {
            // Filtros
            document.querySelectorAll('.btn-filtro').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.btn-filtro').forEach(b => b.classList.remove('ativo'));
                    btn.classList.add('ativo');
                    controller.filtrarPorAtributo(btn.dataset.atributo);
                });
            });

            document.getElementById('filtro-busca').addEventListener('input', (e) => {
                controller.buscarPericias(e.target.value);
            });

            document.getElementById('btn-voltar').addEventListener('click', () => {
                if (window.history.length > 1) {
                    window.history.back();
                } else {
                    window.location.href = '/pages/dashboard.html';
                }
            });

            document.getElementById('btn-salvar-pericias').addEventListener('click', () => {
                controller.salvarPericias();
            });
        }
    </script>
</body>
</html>
