<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de Perícias para D&D 3.5">
    <meta name="theme-color" content="#8B4513">
    <title>Perícias - D&D 3.5</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/pericias.css?v=6.0">
</head>
<body>
    <div class="pericias-wrapper">
        <!-- ========== HEADER ========== -->
        <header class="pericias-header">
            <button id="btn-voltar" class="btn-voltar" aria-label="Voltar">
                ← Voltar
            </button>
            <div class="header-content">
                <h1>⚔️ Perícias do Personagem</h1>
                <p class="subtitulo">D&D 3.5 - Gerencie suas perícias e modificadores</p>
            </div>
            <div class="header-info">
                <span id="combatente-nome" class="combatente-nome">👤 Carregando...</span>
                <span id="combatente-tipo" class="combatente-tipo">(tipo)</span>
            </div>
        </header>

        <!-- ========== SEÇÃO PERÍCIAS DISPONÍVEIS ========== -->
        <section class="pericias-disponíveis-secao">
            <h2 class="secao-titulo">📚 Perícias Disponíveis</h2>
            
            <!-- Filtros -->
            <div class="filtros-container">
                <input type="text" id="filtro-busca" class="filtro-input" placeholder="🔍 Buscar perícia...">
                <button class="btn-filtro ativo" data-atributo="">Todas</button>
                <button class="btn-filtro" data-atributo="FOR">💪 FOR</button>
                <button class="btn-filtro" data-atributo="DES">🎯 DES</button>
                <button class="btn-filtro" data-atributo="CON">❤️ CON</button>
                <button class="btn-filtro" data-atributo="INT">🧠 INT</button>
                <button class="btn-filtro" data-atributo="SAB">👁️ SAB</button>
                <button class="btn-filtro" data-atributo="CAR">💬 CAR</button>
            </div>

            <!-- Grid de Perícias -->
            <div class="pericias-disponivel-grid" id="pericias-disponivel-grid">
                <p class="vazio">⏳ Carregando perícias...</p>
            </div>
        </section>

        <!-- ========== SEÇÃO PERÍCIAS SELECIONADAS ========== -->
        <section class="pericias-selecionadas-secao">
            <h2 class="secao-titulo">⭐ Perícias Selecionadas</h2>
            
            <!-- Grid de Perícias Selecionadas -->
            <div class="pericias-selecionada-grid" id="pericias-selecionada-grid">
                <p class="vazio">Nenhuma perícia adicionada ainda</p>
            </div>

            <!-- Resumo de Estatísticas -->
            <div id="pericias-stats" style="margin-top: 2rem; padding-top: 2rem; border-top: 2px solid var(--cor-dourada);">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div style="text-align: center; padding: 1rem; background: rgba(255,215,0,0.08); border-radius: 8px; border: 2px solid var(--cor-dourada);">
                        <p style="color: #c9b896; margin: 0 0 0.5rem 0; font-size: 0.9rem;">Total de Perícias</p>
                        <p id="stat-total" style="color: var(--cor-dourada); font-size: 1.5rem; margin: 0; font-weight: bold;">0</p>
                    </div>
                    <div style="text-align: center; padding: 1rem; background: rgba(255,215,0,0.08); border-radius: 8px; border: 2px solid var(--cor-dourada);">
                        <p style="color: #c9b896; margin: 0 0 0.5rem 0; font-size: 0.9rem;">Pontos Gastos</p>
                        <p id="stat-gastos" style="color: var(--cor-dourada); font-size: 1.5rem; margin: 0; font-weight: bold;">0</p>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Container para notificações -->
    <div id="toast-container"></div>

    <!-- Scripts -->
    <script type="module">
        import { PericiaController } from '/js/controllers/PericiaController.js';
        import { NotificationService } from '/js/services/NotificationService.js';

        console.log('🎬 Script pericias.html carregado');

        // Verificar token
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/pages/login.html';
        }

        // Inicializar controller
        const controller = new PericiaController();

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                console.log('🎮 Inicializando controller...');
                await controller.inicializar();
                setupFiltros(controller);
                NotificationService.mostrarSucesso('✅ Perícias carregadas!');
            } catch (error) {
                console.error('❌ Erro:', error);
                NotificationService.mostrarErro('Erro: ' + error.message);
            }
        });

        function setupFiltros(controller) {
            // Botões de atributo
            document.querySelectorAll('.btn-filtro').forEach(btn => {
                btn.addEventListener('click', async () => {
                    document.querySelectorAll('.btn-filtro').forEach(b => b.classList.remove('ativo'));
                    btn.classList.add('ativo');
                    
                    const atributo = btn.dataset.atributo;
                    await controller.filtrarPorAtributo(atributo);
                });
            });

            // Busca
            document.getElementById('filtro-busca').addEventListener('input', (e) => {
                controller.buscarPericias(e.target.value);
            });

            // Voltar
            document.getElementById('btn-voltar').addEventListener('click', () => {
                if (window.history.length > 1) {
                    window.history.back();
                } else {
                    window.location.href = '/pages/dashboard.html';
                }
            });
        }

        // Expor controller globalmente para acesso de event listeners
        window.periciaController = controller;
    </script>
</body>
</html>
